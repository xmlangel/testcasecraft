# 앞단 게이트웨이 — 앱이 준비되기 전에도 사람이 읽을 수 있는 화면을 낸다.
#
# 게이트웨이가 없으면 앱이 뜨는 동안 오리진에 아무도 응답하지 않고, 그때 Cloudflare 가
# 영문 502 를 대신 낸다. 그 화면은 무엇을 기다려야 하는지 알려 주지 않는다.
# nginx 는 앱과 따로 뜨고 몇백 밀리초면 준비되므로, 앱이 기동하는 30초에서 1분
# 동안에도 계속 응답한다.

# 이름을 요청마다 푼다. `upstream` 블록에 적으면 nginx 가 뜰 때 한 번 풀고,
# 그때 앱이 없으면 "host not found in upstream" 으로 게이트웨이 자체가 못 뜬다.
# 앱이 죽어 있을 때 안내를 내야 하는데 같이 죽으면 둘 자리가 없다.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # 업로드·첨부 때문에 넉넉히 둔다
    client_max_body_size 100m;

    # 스트리밍 응답(AI 채팅·실행 로그)이 버퍼에 갇히지 않게 한다
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    # 붙는 데 오래 끌지 않는다. 기본 60초로 두면 앱이 죽었을 때 브라우저가 1분을
    # 기다린 뒤에야 안내를 본다 — 실측으로 겪었다
    proxy_connect_timeout 3s;

    location / {
        # 변수로 두면 nginx 가 기동 시점에 이름을 풀지 않는다
        set $app_upstream "http://app:8080";
        proxy_pass $app_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection        "";

        # 앱이 없거나 아직 못 뜬 경우 우리 화면을 낸다.
        #
        # `= @이름` 으로 쓰면 상태 코드가 그 위치의 것(200)으로 바뀐다. 화면에는
        # 오류라고 적혀 있는데 응답은 정상이라 브라우저·모니터링이 성공으로 읽는다.
        # `=502` 로 못 박아 화면의 문구와 실제 코드를 맞춘다
        proxy_intercept_errors on;
        error_page 502 503 504 =502 @starting;
    }

    location @starting {
        root /usr/share/nginx/html;
        # 503 과 Retry-After 를 함께 준다. 검색 엔진과 클라이언트가 "지금은 없음"이
        # 아니라 "잠시 뒤 다시"로 읽는다
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store" always;
        try_files /starting.html =503;
        internal;
    }

    # 게이트웨이 자신이 살아 있는지. 앱 상태와 무관하게 200 을 낸다
    location = /gateway-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
