<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%">
  <defs>
    <style>
      text { font-family: -apple-system, 'Malgun Gothic', sans-serif; }
      .label-title { font-size: 13px; font-weight: bold; fill: #111827; }
      .label-desc { font-size: 12px; fill: #475467; }
      .area-box { stroke: #d0d5dd; fill: #f7f9ff; stroke-width: 1; rx: 6; }
      .frame { stroke: #8590a2; stroke-width: 2; fill: none; }
      .area-label { font-size: 11px; fill: #8590a2; font-weight: bold; }
      .card { stroke: #d0d5dd; fill: #fff; stroke-width: 1; rx: 6; }
    </style>
  </defs>

  <!-- 화면 외곽 -->
  <rect class="frame" x="10" y="10" width="940" height="620"/>

  <!-- A 화면 헤더 -->
  <rect class="area-box" x="30" y="20" width="900" height="50"/>
  <text class="area-label" x="35" y="35">A 화면 헤더</text>
  <text class="label-title" x="480" y="50" text-anchor="middle">프로젝트 관리</text>
  <text class="label-desc" x="850" y="50" text-anchor="end">[+ 새 프로젝트 생성]</text>

  <!-- B 오류 알림 (조건부) -->
  <text class="area-label" x="35" y="85">B 오류 알림 (있을 때만)</text>

  <!-- C 소속 탭 -->
  <rect class="area-box" x="30" y="90" width="900" height="30"/>
  <text class="area-label" x="35" y="105">C 소속 탭</text>
  <text class="label-desc" x="450" y="110" text-anchor="middle">[조직별] [독립] [전체]</text>

  <!-- D 카드 그리드 -->
  <text class="area-label" x="35" y="135">D 카드 그리드</text>

  <!-- 카드 1 -->
  <rect class="card" x="50" y="145" width="240" height="280"/>
  <text class="label-title" x="170" y="165">프로젝트 이름</text>
  <rect class="card" x="60" y="175" width="60" height="20" fill="#f7f9ff"/>
  <text class="label-desc" x="90" y="186" text-anchor="middle">[코드]</text>

  <text class="label-desc" x="60" y="210">🏢 조직명</text>
  <text class="label-desc" x="60" y="230">설명 텍스트</text>

  <line x1="60" y1="250" x2="220" y2="250" stroke="#d0d5dd" stroke-width="1"/>
  <text class="label-desc" x="70" y="270">📄 12  👤 3 ▾  ⚙ 2</text>

  <!-- 멤버 표시 -->
  <circle cx="75" cy="295" r="8" fill="#e5e7eb"/>
  <text class="label-desc" x="75" y="298" text-anchor="middle" font-size="10">M</text>

  <circle cx="95" cy="295" r="8" fill="#e5e7eb"/>
  <circle cx="115" cy="295" r="8" fill="#e5e7eb"/>

  <rect class="card" x="60" y="315" width="180" height="25" fill="#f7f9ff"/>
  <text class="label-title" x="150" y="333" text-anchor="middle">[프로젝트 열기]</text>

  <!-- 카드 2, 3 (축약) -->
  <rect class="card" x="330" y="145" width="240" height="280" fill="#f7f9ff" stroke-dasharray="3,3"/>
  <text class="label-desc" x="450" y="285" text-anchor="middle">…</text>

  <rect class="card" x="610" y="145" width="240" height="280" fill="#f7f9ff" stroke-dasharray="3,3"/>
  <text class="label-desc" x="730" y="285" text-anchor="middle">…</text>

  <!-- E 빈 상태 (조건부) -->
  <text class="area-label" x="35" y="450">E 빈 상태 (프로젝트 0건)</text>
  <text class="label-desc" x="450" y="480" text-anchor="middle">👥 아이콘</text>
  <text class="label-title" x="450" y="510" text-anchor="middle">참여 중인 프로젝트가 없습니다</text>
  <text class="label-desc" x="450" y="530" text-anchor="middle">프로젝트가 없는 사용자는...</text>
  <text class="label-desc" x="450" y="550" text-anchor="middle">초대를 요청하세요</text>

  <!-- 범례 -->
  <text class="label-desc" x="20" y="610" font-size="10">A: 헤더 | B: 알림 | C: 탭 | D: 카드 그리드 | E: 빈 상태</text>
</svg>