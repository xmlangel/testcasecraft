<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" role="img" aria-label="S5 테스트 플랜 가로 탭 레이아웃 배치">
  <defs>
    <style>
      .box   { fill: #fff; stroke: #d0d5dd; stroke-width: 1; }
      .accent{ fill: #f7f9ff; stroke: #c7d2fe; stroke-width: 1; }
      .chrome{ fill: #f3f4f6; stroke: #d0d5dd; stroke-width: 1; }
      .label { font-family: -apple-system, 'Malgun Gothic', sans-serif; font-size: 13px; font-weight: bold; fill: #111827; }
      .desc  { font-family: -apple-system, 'Malgun Gothic', sans-serif; font-size: 12px; fill: #475467; }
      .tiny  { font-family: -apple-system, 'Malgun Gothic', sans-serif; font-size: 11px; fill: #6b7280; }
      .btn   { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315efb"/>
    </marker>
  </defs>

  <!-- S2 껍데기: 헤더 -->
  <rect class="chrome" x="16" y="16" width="928" height="40" rx="6"/>
  <text class="label" x="30" y="41">S2 전역 헤더</text>
  <text class="desc" x="150" y="41">로고 · [프로젝트 선택] · JIRA · ☆ · ? · 레이아웃 전환 · 다크모드 · 아바타</text>

  <!-- 브레드크럼 -->
  <rect class="chrome" x="16" y="62" width="928" height="30" rx="6"/>
  <text class="desc" x="30" y="82">프로젝트 / ShopFlow / 테스트플랜</text>

  <!-- 가로 탭 -->
  <rect class="chrome" x="16" y="98" width="928" height="34" rx="6"/>
  <text class="desc" x="30" y="119">대시보드</text>
  <text class="desc" x="110" y="119">테스트케이스 964</text>
  <rect class="accent" x="222" y="103" width="112" height="24" rx="4"/>
  <text class="label" x="232" y="119">테스트플랜 3</text>
  <text class="desc" x="348" y="119">테스트실행 3</text>
  <text class="desc" x="446" y="119">테스트결과</text>
  <text class="desc" x="536" y="119">자동화 테스트</text>
  <text class="desc" x="644" y="119">RAG 문서</text>
  <text class="desc" x="726" y="119">탐색 세션</text>

  <!-- 영역 A: 플랜 목록 -->
  <rect class="box" x="16" y="146" width="928" height="188" rx="6"/>
  <text class="label" x="30" y="170">A 플랜 목록</text>
  <rect class="btn" x="790" y="156" width="140" height="26" rx="4"/>
  <text class="desc" x="806" y="174">+ 새 플랜 생성</text>
  <rect class="chrome" x="30" y="182" width="240" height="26" rx="4"/>
  <text class="tiny" x="42" y="200">이름으로 찾기</text>

  <!-- 목록 테이블 헤더 -->
  <rect class="chrome" x="30" y="216" width="900" height="26" rx="4"/>
  <text class="tiny" x="42" y="234">이름</text>
  <text class="tiny" x="300" y="234">설명</text>
  <text class="tiny" x="620" y="234">케이스 수</text>
  <text class="tiny" x="720" y="234">생성일</text>
  <text class="tiny" x="880" y="234">⋮</text>
  <!-- 행 3개 -->
  <rect class="box" x="30" y="244" width="900" height="26" rx="3"/>
  <rect class="box" x="30" y="272" width="900" height="26" rx="3"/>
  <rect class="box" x="30" y="300" width="900" height="26" rx="3"/>
  <text class="desc" x="42" y="262">회귀 스위트 v1.0.102</text>
  <text class="desc" x="42" y="290">결제 플로우 점검</text>
  <text class="desc" x="42" y="318">스모크</text>

  <!-- 화살표: 행 클릭 → 상세 -->
  <line x1="480" y1="334" x2="480" y2="366" stroke="#315efb" stroke-width="1.5" marker-end="url(#ar)"/>
  <text class="tiny" x="492" y="356">행 클릭</text>

  <!-- 영역 B: 플랜 상세 (팝업 또는 별도 라우트) -->
  <rect class="accent" x="16" y="372" width="928" height="132" rx="6"/>
  <text class="label" x="30" y="396">B 플랜 상세 — 팝업 또는 별도 라우트</text>
  <text class="desc" x="30" y="418">이름 · 설명 · 포함 케이스 목록</text>
  <rect class="btn" x="30" y="432" width="112" height="26" rx="4"/>
  <text class="desc" x="46" y="450">실행 만들기</text>
  <rect class="btn" x="152" y="432" width="70" height="26" rx="4"/>
  <text class="desc" x="176" y="450">수정</text>
  <rect class="btn" x="232" y="432" width="70" height="26" rx="4"/>
  <text class="desc" x="256" y="450">삭제</text>
  <text class="tiny" x="30" y="482">가로 탭 레이아웃에서는 상세가 팝업 또는 전체 화면으로 열린다. 좌측 메뉴 레이아웃은 2단으로 오른쪽 영역 안에서 완결된다.</text>
</svg>
