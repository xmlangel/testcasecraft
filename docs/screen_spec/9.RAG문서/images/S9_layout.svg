  <text class="tiny" x="36" y="295">파일명</text>
  <text class="tiny" x="397.6" y="295">상태</text>
  <text class="tiny" x="638.667" y="295">청크</text>
  <text class="tiny" x="759.2" y="295">크기</text>
  <text class="tiny" x="879.733" y="295">⋮</text>
  <text class="desc" x="36" y="321">test_specification.pdf</text>
  <text class="desc" x="397.6" y="321">준비됨 ✓</text>
  <text class="desc" x="638.667" y="321">42</text>
  <text class="desc" x="759.2" y="321">3.2 MB</text>
  <text class="desc" x="879.733" y="321">⋮</text>
  <text class="desc" x="36" y="345">requirement_2024.md</text>
