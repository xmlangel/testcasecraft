    .tiny  { font-family:-apple-system,'Malgun Gothic',sans-serif; font-size:11px; fill:#6b7280 }
    .strong{ font-family:-apple-system,'Malgun Gothic',sans-serif; font-size:12px; font-weight:bold; fill:#111827 }
    </style>
  </defs>
  <rect class="bx-ch" x="16" y="16" width="928" height="64" rx="6"/>
  <text class="area" x="28" y="39">A 화면 헤더</text>
  <text class="desc" x="932" y="39" text-anchor="end">[+ 문서 추가]</text>
  <text class="desc" x="28" y="60">제목 `RAG 문서`</text>
