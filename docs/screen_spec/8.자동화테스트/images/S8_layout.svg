<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1200" width="100%">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1a1a1a; --border: #333; --text: #e0e0e0; --label: #999; }
        .bg { fill: #1f1f1f; }
        .border { stroke: #444; }
        .label { fill: #aaa; }
        .text { fill: #e0e0e0; }
      }
      @media (prefers-color-scheme: light) {
        :root { --bg: #fff; --border: #d0d5dd; --text: #111827; --label: #666; }
        .bg { fill: #fff; }
        .border { stroke: #d0d5dd; }
        .label { fill: #666; }
        .text { fill: #111827; }
      }
      :root[data-theme="dark"] .bg { fill: #1f1f1f; }
      :root[data-theme="dark"] .border { stroke: #444; }
      :root[data-theme="dark"] .label { fill: #aaa; }
      :root[data-theme="dark"] .text { fill: #e0e0e0; }
      :root[data-theme="light"] .bg { fill: #fff; }
      :root[data-theme="light"] .border { stroke: #d0d5dd; }
      :root[data-theme="light"] .label { fill: #666; }
      :root[data-theme="light"] .text { fill: #111827; }

      .frame { fill: none; stroke-width: 1; }
      .rect-solid { fill: #f7f9ff; stroke-width: 1; }
      .title { font-size: 13px; font-weight: bold; }
      .desc { font-size: 12px; }
    </style>
  </defs>

  <!-- 전체 배경 -->
  <rect width="960" height="1200" class="bg" />

  <!-- 헤더(A) -->
  <rect x="20" y="20" width="920" height="60" rx="6" class="rect-solid border" />
  <text x="40" y="45" class="title text">자동화 테스트</text>
  <rect x="820" y="30" width="100" height="40" rx="4" fill="#4CAF50" />
  <text x="850" y="52" class="desc" fill="white" text-anchor="middle">[+ 업로드]</text>

  <!-- 오류 알림(B) - 숨겨짐 -->
  <text x="40" y="110" class="desc label">B. 오류 알림 (조회 실패 시 표시)</text>

  <!-- 통계 Accordion(C) -->
  <rect x="20" y="130" width="920" height="280" rx="6" class="frame border" stroke-width="2" />
  <text x="40" y="155" class="title text">테스트 결과 통계</text>

  <!-- 개요 카드(C.1) -->
  <g id="overview">
    <!-- 통과 -->
    <rect x="40" y="175" width="200" height="70" rx="4" class="rect-solid border" />
    <text x="60" y="195" class="desc label">통과</text>
    <text x="60" y="225" class="title text" fill="#4CAF50">425건</text>

    <!-- 실패 -->
    <rect x="260" y="175" width="200" height="70" rx="4" class="rect-solid border" />
    <text x="280" y="195" class="desc label">실패</text>
    <text x="280" y="225" class="title text" fill="#f44336">15건</text>

    <!-- 에러 -->
    <rect x="480" y="175" width="200" height="70" rx="4" class="rect-solid border" />
    <text x="500" y="195" class="desc label">에러</text>
    <text x="500" y="225" class="title text" fill="#FF9800">5건</text>

    <!-- 건너뜀 -->
    <rect x="700" y="175" width="200" height="70" rx="4" class="rect-solid border" />
    <text x="720" y="195" class="desc label">건너뜀</text>
    <text x="720" y="225" class="title text" fill="#9E9E9E">5건</text>
  </g>

  <!-- 기간 필터(D) -->
  <text x="40" y="275" class="desc label">기간 필터:</text>
  <rect x="140" y="260" width="50" height="28" rx="4" fill="#E8F5E9" />
  <text x="165" y="280" class="desc" text-anchor="middle" fill="#2E7D32">7d</text>
  <rect x="210" y="260" width="50" height="28" rx="4" class="rect-solid border" />
  <text x="235" y="280" class="desc text" text-anchor="middle">30d</text>
  <rect x="280" y="260" width="50" height="28" rx="4" class="rect-solid border" />
  <text x="305" y="280" class="desc text" text-anchor="middle">90d</text>
  <rect x="350" y="260" width="50" height="28" rx="4" class="rect-solid border" />
  <text x="375" y="280" class="desc text" text-anchor="middle">전체</text>

  <!-- 차트 플레이스홀더 -->
  <rect x="40" y="305" width="420" height="95" rx="4" class="border" fill="none" stroke-dasharray="5,5" />
  <text x="250" y="360" class="desc label" text-anchor="middle">[원형 차트: 상태별 비율]</text>
  <rect x="500" y="305" width="420" height="95" rx="4" class="border" fill="none" stroke-dasharray="5,5" />
  <text x="710" y="360" class="desc label" text-anchor="middle">[막대 차트: 일별 추이]</text>

  <!-- 목록 헤더(E) -->
  <rect x="20" y="430" width="920" height="60" rx="6" class="rect-solid border" />
  <text x="40" y="450" class="desc label">검색:</text>
  <rect x="100" y="438" width="300" height="36" rx="4" class="border" fill="none" />
  <text x="115" y="460" class="desc label">파일명 또는 실행이름</text>

  <!-- 상태 필터 탭 -->
  <text x="450" y="450" class="desc label">상태:</text>
  <rect x="510" y="438" width="50" height="36" rx="4" fill="#E3F2FD" />
  <text x="535" y="460" class="desc" text-anchor="middle" fill="#1976D2">전체</text>
  <rect x="580" y="438" width="50" height="36" rx="4" class="rect-solid border" />
  <text x="605" y="460" class="desc text" text-anchor="middle">통과</text>
  <rect x="650" y="438" width="50" height="36" rx="4" class="rect-solid border" />
  <text x="675" y="460" class="desc text" text-anchor="middle">실패</text>
  <rect x="720" y="438" width="50" height="36" rx="4" class="rect-solid border" />
  <text x="745" y="460" class="desc text" text-anchor="middle">건너뜀</text>

  <!-- 결과 테이블(F) -->
  <rect x="20" y="510" width="920" height="400" rx="6" class="border" fill="none" stroke-width="2" />

  <!-- 테이블 헤더 -->
  <rect x="20" y="510" width="920" height="35" fill="#F5F5F5" rx="6" />
  <text x="40" y="533" class="desc" font-weight="bold">파일명</text>
  <text x="200" y="533" class="desc" font-weight="bold">실행이름</text>
  <text x="350" y="533" class="desc" font-weight="bold">상태</text>
  <text x="470" y="533" class="desc" font-weight="bold">테스트수</text>
  <text x="580" y="533" class="desc" font-weight="bold">성공률</text>
  <text x="730" y="533" class="desc" font-weight="bold">업로드일</text>
  <text x="880" y="533" class="desc" font-weight="bold">⋮</text>

  <!-- 행 1 -->
  <line x1="20" y1="545" x2="940" y2="545" class="border" stroke-width="1" />
  <text x="40" y="568" class="desc">api_test.xml</text>
  <text x="200" y="568" class="desc">Chrome E2E Run 1</text>
  <rect x="350" y="555" width="60" height="24" rx="4" fill="#C8E6C9" />
  <text x="380" y="572" class="desc" text-anchor="middle" fill="#2E7D32">완료</text>
  <text x="580" y="568" class="desc">120</text>
  <!-- 성공률 진행바 -->
  <rect x="640" y="558" width="70" height="16" rx="2" fill="#E0E0E0" />
  <rect x="640" y="558" width="67" height="16" rx="2" fill="#4CAF50" />
  <text x="715" y="569" class="desc">94.2%</text>
  <text x="780" y="568" class="desc">08-03 14:35</text>
  <circle cx="895" cy="568" r="4" fill="#999" />

  <!-- 행 2 -->
  <line x1="20" y1="590" x2="940" y2="590" class="border" stroke-width="1" />
  <text x="40" y="613" class="desc">ui_test_mobile.xml</text>
  <text x="200" y="613" class="desc">Firefox Run 2</text>
  <rect x="350" y="600" width="60" height="24" rx="4" fill="#FFCDD2" />
  <text x="380" y="617" class="desc" text-anchor="middle" fill="#D32F2F">실패</text>
  <text x="580" y="613" class="desc">85</text>
  <!-- 성공률 진행바 -->
  <rect x="640" y="603" width="70" height="16" rx="2" fill="#E0E0E0" />
  <rect x="640" y="603" width="56" height="16" rx="2" fill="#FF9800" />
  <text x="715" y="614" class="desc">80%</text>
  <text x="780" y="613" class="desc">08-02 10:15</text>
  <circle cx="895" cy="613" r="4" fill="#999" />

  <!-- 행 3 (PROCESSING) -->
  <line x1="20" y1="635" x2="940" y2="635" class="border" stroke-width="1" />
  <text x="40" y="658" class="desc">perf_load_test.xml</text>
  <text x="200" y="658" class="desc">—</text>
  <rect x="350" y="645" width="60" height="24" rx="4" fill="#FFE0B2" />
  <text x="380" y="662" class="desc" text-anchor="middle" fill="#E65100">처리중</text>
  <text x="580" y="658" class="desc">—</text>
  <text x="715" y="658" class="desc">—</text>
  <text x="780" y="658" class="desc">08-03 21:40</text>
  <circle cx="895" cy="658" r="4" fill="#999" />

  <!-- 더 많은 행이 있음을 표시 -->
  <line x1="20" y1="680" x2="940" y2="680" class="border" stroke-width="1" />
  <text x="450" y="760" class="desc label" text-anchor="middle">⋮ (더 많은 행) ⋮</text>

  <!-- 페이지네이션 -->
  <text x="450" y="870" class="desc label" text-anchor="middle">페이지 1 / 3</text>

  <!-- 빈 상태(G) - 설명만 -->
  <text x="40" y="930" class="desc label">G. 빈 상태 (결과 0건일 때 표시)</text>
  <rect x="150" y="915" width="660" height="50" rx="4" class="rect-solid border" fill="#F5F5F5" />
  <text x="480" y="948" class="desc label" text-anchor="middle">자동화 테스트 결과가 없습니다. [+ 업로드] 버튼으로 XML을 올려주세요.</text>

  <!-- 업로드 다이얼로그(H) - 설명 -->
  <text x="40" y="1000" class="desc label">H. 업로드 다이얼로그 (클릭 시 표시)</text>
  <rect x="100" y="1015" width="760" height="140" rx="6" class="rect-solid border" />
  <text x="120" y="1040" class="title text">JUnit XML 파일 업로드</text>
  <rect x="120" y="1050" width="720" height="50" rx="4" class="border" fill="none" stroke-dasharray="5,5" />
  <text x="480" y="1082" class="desc label" text-anchor="middle">[파일 선택 또는 드래그앤드롭]</text>
  <text x="120" y="1110" class="desc label">실행 이름 (선택):</text>
  <rect x="280" y="1105" width="200" height="24" rx="4" class="border" fill="none" />
  <text x="650" y="1133" class="desc label">[취소]  [업로드]</text>

  <!-- 범례 및 영역 라벨 (좌측) -->
  <text x="20" y="1180" class="desc label" font-style="italic">A: 화면 헤더 | B: 오류 알림 | C: 통계 Accordion | D: 기간 필터</text>
</svg>