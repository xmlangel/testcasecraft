<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 408" width="100%" role="img" aria-label="S5 Test Plans two-pane sidebar layout">
  <defs>
    <style>
    .bx    { fill:#fff; stroke:#d0d5dd; stroke-width:1 }
    .bx-ac { fill:#f7f9ff; stroke:#c7d2fe; stroke-width:1 }
    .bx-ch { fill:#f3f4f6; stroke:#d0d5dd; stroke-width:1 }
    .bx-dq { fill:#fff; stroke:#d0d5dd; stroke-width:1; stroke-dasharray:4 3 }
    .bx-bt { fill:#eef2ff; stroke:#c7d2fe; stroke-width:1 }
    .bx-hd { fill:#f9fafb; stroke:#e5e7eb; stroke-width:1 }
    .area  { font-family:-apple-system,'Malgun Gothic',sans-serif; font-size:13px; font-weight:bold; fill:#111827 }
    .desc  { font-family:-apple-system,'Malgun Gothic',sans-serif; font-size:12px; fill:#475467 }
    .tiny  { font-family:-apple-system,'Malgun Gothic',sans-serif; font-size:11px; fill:#6b7280 }
    .strong{ font-family:-apple-system,'Malgun Gothic',sans-serif; font-size:12px; font-weight:bold; fill:#111827 }
    </style>
  </defs>
  <rect class="bx-ch" x="16" y="16" width="928" height="64" rx="6"/>
  <text class="area" x="28" y="39">S2 Shell</text>
  <text class="desc" x="28" y="60">Header · breadcrumb (project picker) · sidebar</text>
  <rect class="bx" x="16" y="90" width="344.25" height="178" rx="6"/>
  <text class="area" x="28" y="113">A Plan tree (left)</text>
  <text class="desc" x="28" y="134">[+ New plan] · Search</text>
  <text class="desc" x="28" y="153">▾ Regression suite v1.0.102</text>
  <text class="desc" x="28" y="172">   └ execution 2026-08-02</text>
  <text class="desc" x="28" y="191">   └ execution 2026-07-28</text>
  <text class="desc" x="28" y="210">▸ Payment flow check</text>
  <text class="desc" x="28" y="229">▸ Smoke test</text>
  <text class="tiny" x="28" y="248">Parent: plan, children: executions</text>
  <rect class="bx-ac" x="370.25" y="90" width="573.75" height="178" rx="6"/>
  <text class="area" x="382.25" y="113">B Detail (right)</text>
  <text class="desc" x="382.25" y="134">Plan name · description · included cases</text>
  <text class="desc" x="382.25" y="153">[New] [Edit] [Delete]</text>
  <text class="desc" x="382.25" y="172">Select execution — shows details</text>
  <text class="desc" x="382.25" y="191">[Back to plan]</text>
  <text class="tiny" x="382.25" y="210">Self-contained in area</text>
  <rect class="bx-dq" x="16" y="278" width="928" height="64" rx="6"/>
  <text class="area" x="28" y="301">Empty (0 plans)</text>
  <text class="desc" x="28" y="322">No plans · [+ New plan]</text>
  <text class="tiny" x="16" y="363">Tab layout diagram: see S5_layout_tabs.svg.</text>
  <text class="strong" x="16" y="390">Legend</text>
  <rect class="bx" x="73.60" y="381" width="13" height="13" rx="3"/>
  <text class="tiny" x="92.60" y="391">Regular area</text>
  <rect class="bx-ac" x="183.20" y="381" width="13" height="13" rx="3"/>
  <text class="tiny" x="202.20" y="391">Highlighted · conditional areas</text>
  <rect class="bx-ch" x="407.75" y="381" width="13" height="13" rx="3"/>
  <text class="tiny" x="426.75" y="391">Global chrome</text>
  <rect class="bx-dq" x="523.40" y="381" width="13" height="13" rx="3"/>
  <text class="tiny" x="542.40" y="391">Empty · hidden</text>
  <rect class="bx-bt" x="645.10" y="381" width="13" height="13" rx="3"/>
  <text class="tiny" x="664.10" y="391">Button · Action</text>
</svg>
