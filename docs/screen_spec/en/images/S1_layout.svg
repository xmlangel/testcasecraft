  <text class="desc" x="28" y="320">🏢 Organization name or 🌐 standalone project</text>
  <text class="desc" x="28" y="339">Description (omit if empty)</text>
  <text class="desc" x="28" y="358">📄 Cases 12 · 👤 Members 3 ▾ · ⚙ Automated 2</text>
  <text class="desc" x="28" y="377">Members expanded: avatar + name + role badge (max …</text>
  <text class="desc" x="28" y="396">[Open]</text>
  <rect class="bx" x="328.667" y="257" width="302.667" height="159" rx="6"/>
  <text class="area" x="340.667" y="280">Card 2</text>
  <text class="tiny" x="340.667" y="301">Grid repeat</text>
  <rect class="bx" x="641.333" y="257" width="302.667" height="159" rx="6"/>
  <text class="area" x="653.333" y="280">Card 3</text>
  <text class="tiny" x="653.333" y="301">Grid repeat</text>
  <rect class="bx-dq" x="16" y="426" width="928" height="102" rx="6"/>
  <text class="area" x="28" y="449">E Empty (no projects)</text>
  <text class="desc" x="28" y="470">👥 Icon · No active projects</text>
  <text class="desc" x="28" y="489">Users without projects must be invited to use.</text>
  <text class="desc" x="28" y="508">Request project invite from admin + [create]</text>
  <rect class="bx-bt" x="16" y="538" width="224.5" height="83" rx="6"/>
  <text class="area" x="28" y="561">F Card menu</text>
  <text class="desc" x="28" y="582">Edit · org transfer</text>
  <text class="desc" x="28" y="601">Delete · Force delete</text>
  <rect class="bx-ac" x="250.5" y="538" width="224.5" height="83" rx="6"/>
  <text class="area" x="262.5" y="561">G Create·Edit dialog</text>
  <text class="desc" x="262.5" y="582">Name · code · org · description</text>
  <rect class="bx-ac" x="485" y="538" width="224.5" height="83" rx="6"/>
