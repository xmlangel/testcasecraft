  <rect class="bx-ch" x="407.75" y="639" width="13" height="13" rx="3"/>
  <text class="tiny" x="426.75" y="649">Global chrome</text>
  <rect class="bx-dq" x="523.40" y="639" width="13" height="13" rx="3"/>
  <text class="tiny" x="542.40" y="649">Empty · hidden</text>
  <rect class="bx-bt" x="645.10" y="639" width="13" height="13" rx="3"/>
  <text class="tiny" x="664.10" y="649">Button · Action</text>
</svg>
