<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" role="img" aria-label="S5 Test Plans tab layout">
  <defs>
    <style>
      .box   { fill: #fff; stroke: #d0d5dd; stroke-width: 1; }
      .accent{ fill: #f7f9ff; stroke: #c7d2fe; stroke-width: 1; }
      .chrome{ fill: #f3f4f6; stroke: #d0d5dd; stroke-width: 1; }
      .label { font-family: -apple-system, 'Malgun Gothic', sans-serif; font-size: 13px; font-weight: bold; fill: #111827; }
      .desc  { font-family: -apple-system, 'Malgun Gothic', sans-serif; font-size: 12px; fill: #475467; }
      .tiny  { font-family: -apple-system, 'Malgun Gothic', sans-serif; font-size: 11px; fill: #6b7280; }
      .btn   { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315efb"/>
    </marker>
  </defs>

  <rect class="chrome" x="16" y="16" width="928" height="40" rx="6"/>
  <text class="label" x="30" y="41">S2 Global header</text>
  <text class="desc" x="150" y="41">Logo · [Project select] · JIRA · ☆ · ? · layout toggle · dark mode · avatar</text>

  <rect class="chrome" x="16" y="62" width="928" height="30" rx="6"/>
  <text class="desc" x="30" y="82">Projects / ShopFlow / Test Plans</text>

  <rect class="chrome" x="16" y="98" width="928" height="34" rx="6"/>
  <text class="desc" x="30" y="119">Dashboards</text>
  <text class="desc" x="110" y="119">Test Cases 964</text>
  <rect class="accent" x="222" y="103" width="112" height="24" rx="4"/>
  <text class="label" x="232" y="119">Plan 3</text>
  <text class="desc" x="348" y="119">Execution 3</text>
  <text class="desc" x="446" y="119">Test Results</text>
  <text class="desc" x="536" y="119">Automated Tests</text>
  <text class="desc" x="644" y="119">RAG</text>
  <text class="desc" x="726" y="119">Exploratory</text>

  <rect class="box" x="16" y="146" width="928" height="188" rx="6"/>
  <text class="label" x="30" y="170">A Plan list</text>
  <rect class="btn" x="790" y="156" width="140" height="26" rx="4"/>
  <text class="desc" x="806" y="174">+ New plan</text>
  <rect class="chrome" x="30" y="182" width="240" height="26" rx="4"/>
  <text class="tiny" x="42" y="200">Find by name</text>

  <rect class="chrome" x="30" y="216" width="900" height="26" rx="4"/>
  <text class="tiny" x="42" y="234">Name</text>
  <text class="tiny" x="300" y="234">Description</text>
  <text class="tiny" x="620" y="234">Case count</text>
  <text class="tiny" x="720" y="234">Created</text>
  <text class="tiny" x="880" y="234">⋮</text>
  <rect class="box" x="30" y="244" width="900" height="26" rx="3"/>
  <rect class="box" x="30" y="272" width="900" height="26" rx="3"/>
  <rect class="box" x="30" y="300" width="900" height="26" rx="3"/>
  <text class="desc" x="42" y="262">Regression suite v1.0.102</text>
  <text class="desc" x="42" y="290">Payment flow check</text>
  <text class="desc" x="42" y="318">Smoke</text>

  <line x1="480" y1="334" x2="480" y2="366" stroke="#315efb" stroke-width="1.5" marker-end="url(#ar)"/>
  <text class="tiny" x="492" y="356">Click row</text>

  <rect class="accent" x="16" y="372" width="928" height="132" rx="6"/>
  <text class="label" x="30" y="396">B Plan detail — popup</text>
  <text class="desc" x="30" y="418">Name · description · cases</text>
  <rect class="btn" x="30" y="432" width="112" height="26" rx="4"/>
  <text class="desc" x="46" y="450">Create execution</text>
  <rect class="btn" x="152" y="432" width="70" height="26" rx="4"/>
  <text class="desc" x="176" y="450">edit</text>
  <rect class="btn" x="232" y="432" width="70" height="26" rx="4"/>
  <text class="desc" x="256" y="450">delete</text>
  <text class="tiny" x="30" y="482">Tab layout: detail opens as popup or full screen. Sidebar layout: 2-tier, contained within right area.</text>
</svg>
