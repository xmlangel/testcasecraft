<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 683" width="100%" role="img" aria-label="S0 Login &amp; Account layout">
  <defs>
    <style>
    .bx    { fill:#fff; stroke:#d0d5dd; stroke-width:1 }
    .bx-ac { fill:#f7f9ff; stroke:#c7d2fe; stroke-width:1 }
    .bx-ch { fill:#f3f4f6; stroke:#d0d5dd; stroke-width:1 }
    .bx-dq { fill:#fff; stroke:#d0d5dd; stroke-width:1; stroke-dasharray:4 3 }
    .bx-bt { fill:#eef2ff; stroke:#c7d2fe; stroke-width:1 }
    .bx-hd { fill:#f9fafb; stroke:#e5e7eb; stroke-width:1 }
    .area  { font-family:-apple-system,'Malgun Gothic',sans-serif; font-size:13px; font-weight:bold; fill:#111827 }
    .desc  { font-family:-apple-system,'Malgun Gothic',sans-serif; font-size:12px; fill:#475467 }
    .tiny  { font-family:-apple-system,'Malgun Gothic',sans-serif; font-size:11px; fill:#6b7280 }
    .strong{ font-family:-apple-system,'Malgun Gothic',sans-serif; font-size:12px; font-weight:bold; fill:#111827 }
    </style>
  </defs>
  <rect class="bx-ch" x="16" y="16" width="928" height="64" rx="6"/>
  <text class="area" x="28" y="39">A Language</text>
  <text class="desc" x="28" y="60">Top right · Korean / English</text>
  <rect class="bx" x="16" y="90" width="928" height="64" rx="6"/>
  <text class="area" x="28" y="113">B Card title</text>
  <text class="desc" x="28" y="134">By mode: `Login` or `Signup` · card shared by both</text>
  <rect class="bx" x="16" y="164" width="928" height="121" rx="6"/>
  <text class="area" x="28" y="187">C Input form</text>
  <text class="desc" x="28" y="208">1 ID (common, autoFocus)      2 Password (common)</text>
  <text class="desc" x="28" y="227">3 Password confirm (signup mode only)</text>
  <text class="desc" x="28" y="246">4 Name (signup)              5 Email (signup)</text>
  <text class="tiny" x="28" y="265">All fields fullWidth · disable on load · form no-autocomplete</text>
  <rect class="bx-ac" x="16" y="295" width="928" height="64" rx="6"/>
  <text class="area" x="28" y="318">D Alert area</text>
  <text class="desc" x="28" y="339">Show error (red) or guide (green) only · clear on switch/input</text>
  <rect class="bx" x="16" y="369" width="612" height="102" rx="6"/>
  <text class="area" x="28" y="392">E Action area</text>
  <text class="desc" x="28" y="413">Main button: [login] / [sign up]</text>
  <text class="desc" x="28" y="432">Toggle: [sign up] / [back to login]</text>
  <text class="tiny" x="28" y="451">While loading: buttons disappear, progress indicator appears.</text>
  <rect class="bx-bt" x="638" y="369" width="306" height="102" rx="6"/>
  <text class="area" x="650" y="392">Bottom link</text>
  <text class="desc" x="650" y="413">User manual · User Manual</text>
  <text class="tiny" x="650" y="432">open /manual in new tab</text>
  <rect class="bx-ac" x="16" y="481" width="928" height="83" rx="6"/>
  <text class="area" x="28" y="504">F Email verification</text>
  <text class="desc" x="28" y="525">Processing · success (green check) · expired (orange warning) · already used (blue notice) · failed (red error)</text>
  <text class="tiny" x="28" y="544">Expired · Fail only: [Resend] shown · USED not treated as error</text>
  <rect class="bx-dq" x="16" y="574" width="928" height="64" rx="6"/>
  <text class="area" x="28" y="597">G Manual viewer</text>
  <text class="desc" x="28" y="618">Language · sections · prev/next · back</text>
  <text class="strong" x="16" y="665">Legend</text>
  <rect class="bx" x="73.60" y="656" width="13" height="13" rx="3"/>
  <text class="tiny" x="92.60" y="666">Regular area</text>
  <rect class="bx-ac" x="183.20" y="656" width="13" height="13" rx="3"/>
  <text class="tiny" x="202.20" y="666">Highlighted · conditional areas</text>
  <rect class="bx-ch" x="407.75" y="656" width="13" height="13" rx="3"/>
  <text class="tiny" x="426.75" y="666">Global chrome</text>
  <rect class="bx-dq" x="523.40" y="656" width="13" height="13" rx="3"/>
  <text class="tiny" x="542.40" y="666">Empty · hidden</text>
  <rect class="bx-bt" x="645.10" y="656" width="13" height="13" rx="3"/>
  <text class="tiny" x="664.10" y="666">Button · Action</text>
</svg>
