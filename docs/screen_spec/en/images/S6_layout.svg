  <rect class="box-normal" x="320" y="20" width="620" height="350"/>
  <text class="heading" x="330" y="40">B. Execution detail</text>
  <text class="label" x="330" y="55">/projects/{id}/executions/{eid}</text>

  <rect class="spacer" x="330" y="65" width="600" height="50" rx="4"/>
  <text class="label" x="340" y="85">ShopFlow iOS v1.0 | regression</text>
  <text class="label" x="340" y="100">Author: tester1 | created 2026-07-20 14:32</text>
  <text class="label" x="340" y="115">Progress [████░░░░░░] 12/20</text>

  <rect class="box-highlight" x="330" y="125" width="150" height="220" rx="4"/>
  <text class="heading" x="340" y="145">filter</text>
  <text class="label" x="340" y="165">Results</text>
  <text class="label" x="345" y="178">☑ PASS (5)</text>
  <text class="label" x="345" y="191">☐ FAIL (2)</text>
  <text class="label" x="345" y="204">☐ BLOCKED</text>
  <text class="label" x="345" y="217">☐ NOTRUN</text>
  <text class="label" x="340" y="235">Priority</text>
  <text class="label" x="340" y="250">Executor</text>
  <text class="label" x="340" y="263">Other: tag, note</text>

  <rect class="box-normal" x="490" y="125" width="440" height="220" rx="4"/>
  <text class="heading" x="500" y="145">Case list (filters applied)</text>

  <rect class="spacer" x="490" y="155" width="440" height="25" rx="2"/>
  <text class="label" x="500" y="172">ID | Title | Result | Executor | Time</text>

  <rect class="box-normal" x="490" y="185" width="440" height="28" rx="2"/>
  <text class="label" x="500" y="203">TC-0001 | Login | PASS | tester1</text>

  <rect class="box-normal" x="490" y="218" width="440" height="28" rx="2"/>
  <text class="label" x="500" y="236">TC-0005 | Cancel | NOTRUN</text>

  <rect class="box-highlight" x="490" y="251" width="440" height="28" rx="2"/>
  <text class="label" x="500" y="269">TC-0008 | Order | FAIL</text>

  <rect class="box-normal" x="20" y="390" width="920" height="480"/>
