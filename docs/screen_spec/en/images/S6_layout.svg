  <text class="label" x="40" y="475">User views order history &amp; details | 4 steps | High | 2 attachments</text>
  <text class="label" x="40" y="490">Case attachments (read-only)</text>

  <rect class="box-normal" x="30" y="525" width="900" height="330" rx="4"/>

  <rect x="820" y="540" width="38" height="33" rx="4" fill="#10b981" stroke="#059669" stroke-width="1"/>
  <text style="font-size: 18px; font-weight: bold; fill: #fff;" x="833" y="558">P</text>
  <text class="label" x="820" y="575">PASS</text>

  <rect x="870" y="540" width="38" height="33" rx="4" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>
  <text style="font-size: 18px; font-weight: bold; fill: #fff;" x="883" y="558">F</text>
  <text class="label" x="870" y="575">FAIL</text>

  <rect x="820" y="580" width="38" height="33" rx="4" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <text style="font-size: 16px; font-weight: bold; fill: #fff;" x="831" y="598">B</text>
  <text class="label" x="810" y="615">BLOCKED</text>

  <rect x="870" y="580" width="38" height="33" rx="4" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
  <text style="font-size: 18px; font-weight: bold; fill: #fff;" x="883" y="598">N</text>
  <text class="label" x="870" y="615">NOTRUN</text>

  <text class="heading" x="40" y="555">Note (Markdown)</text>
  <rect class="box-normal" x="40" y="563" width="760" height="48" rx="4"/>
  <text class="label" x="50" y="583">- After login: order list displays normally</text>
  <text class="label" x="50" y="598">- Click detail: loads (3s delay)</text>

  <text class="heading" x="40" y="630">tag</text>
  <rect class="box-normal" x="40" y="638" width="760" height="28" rx="4"/>
  <text class="label" x="50" y="656">[iOS] [Order] [Perf-delay]</text>

  <text class="heading" x="40" y="683">JIRA</text>
  <rect class="box-normal" x="40" y="691" width="760" height="28" rx="4"/>
  <text class="label" x="50" y="709">SMP-285 (auto)</text>

  <text class="heading" x="40" y="742">Result attachment</text>
  <rect class="box-normal" x="40" y="750" width="760" height="45" rx="4"/>
  <text class="label" x="50" y="768">2 screenshots | 1 log | [delete] [add]</text>

  <text class="heading" x="40" y="814">Previous results</text>
  <rect class="box-highlight" x="40" y="822" width="760" height="28" rx="4"/>
  <text class="label" x="50" y="840">[Last result]</text>

  <text class="label" x="30" y="875" style="font-size: 11px;">     Auto-save: 1.5s after change | read-only remains unsaved | 20s polling (when tab active)     </text>
</svg>
