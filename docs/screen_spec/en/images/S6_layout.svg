  <text class="label" x="40" y="180">In progress | 12/20 | Regression smoke</text>
  <text class="label" x="40" y="193">2026-07-20 14:32 | ⋮</text>

  <rect class="box-normal" x="30" y="205" width="260" height="45" rx="4"/>
  <text class="label" x="40" y="220">🔹 Payment feature UAT</text>
