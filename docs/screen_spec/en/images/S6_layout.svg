<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" width="100%">
  <defs>
    <style>
      .heading { font-size: 13px; font-weight: bold; fill: #111827; }
      .label { font-size: 12px; fill: #475467; }
      .box-normal { fill: #fff; stroke: #d0d5dd; stroke-width: 1; rx: 6; }
      .box-highlight { fill: #f7f9ff; stroke: #d0d5dd; stroke-width: 1; rx: 6; }
      .spacer { fill: #f3f4f6; stroke: #d0d5dd; stroke-width: 1; }
      .line { stroke: #d0d5dd; stroke-width: 1; }
    </style>
  </defs>

  <rect class="box-normal" x="20" y="20" width="280" height="350"/>
  <text class="heading" x="30" y="40">A. Execution list</text>
  <text class="label" x="30" y="55">/projects/{id}/executions</text>

  <rect class="spacer" x="30" y="65" width="260" height="35" rx="4"/>
  <text class="label" x="40" y="86">🔍 Title search</text>

  <rect class="box-highlight" x="30" y="110" width="260" height="30" rx="4"/>
  <text class="label" x="40" y="130">[+ New exec]</text>

  <rect class="box-normal" x="30" y="150" width="260" height="45" rx="4"/>
