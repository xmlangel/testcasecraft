<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 404" width="100%" role="img" aria-label="S11 Administrator Settings structure">
  <defs>
    <style>
    .bx    { fill:#fff; stroke:#d0d5dd; stroke-width:1 }
    .bx-ac { fill:#f7f9ff; stroke:#c7d2fe; stroke-width:1 }
    .bx-ch { fill:#f3f4f6; stroke:#d0d5dd; stroke-width:1 }
    .bx-dq { fill:#fff; stroke:#d0d5dd; stroke-width:1; stroke-dasharray:4 3 }
    .bx-bt { fill:#eef2ff; stroke:#c7d2fe; stroke-width:1 }
    .bx-hd { fill:#f9fafb; stroke:#e5e7eb; stroke-width:1 }
    .area  { font-family:-apple-system,'Malgun Gothic',sans-serif; font-size:13px; font-weight:bold; fill:#111827 }
    .desc  { font-family:-apple-system,'Malgun Gothic',sans-serif; font-size:12px; fill:#475467 }
    .tiny  { font-family:-apple-system,'Malgun Gothic',sans-serif; font-size:11px; fill:#6b7280 }
    .strong{ font-family:-apple-system,'Malgun Gothic',sans-serif; font-size:12px; font-weight:bold; fill:#111827 }
    </style>
  </defs>
  <rect class="bx-ch" x="16" y="16" width="928" height="83" rx="6"/>
  <text class="area" x="28" y="39">Entry — header `[admin menu ▾]` (ADMIN only)</text>
  <text class="desc" x="28" y="60">Org · user · mail · LLM · scheduler admin</text>
  <text class="tiny" x="28" y="79">Translation mgmt commented — URL-only entry</text>
  <rect class="bx" x="16" y="109" width="302.667" height="83" rx="6"/>
  <text class="area" x="28" y="132">Org admin /organizations</text>
  <text class="desc" x="28" y="153">list · create · edit</text>
  <text class="desc" x="28" y="172">Details: member · group perms</text>
  <rect class="bx" x="328.667" y="109" width="302.667" height="83" rx="6"/>
  <text class="area" x="340.667" y="132">User mgmt /users</text>
  <text class="desc" x="340.667" y="153">4 stat cards · search · filters</text>
  <text class="desc" x="340.667" y="172">Actions: detail·reset password·role·…</text>
  <rect class="bx" x="641.333" y="109" width="302.667" height="83" rx="6"/>
  <text class="area" x="653.333" y="132">Mail settings /mail-settings</text>
  <text class="desc" x="653.333" y="153">SMTP host·port·account</text>
  <text class="desc" x="653.333" y="172">Sender · Template · Test send</text>
  <rect class="bx" x="16" y="202" width="302.667" height="83" rx="6"/>
  <text class="area" x="28" y="225">LLM settings</text>
  <text class="desc" x="28" y="246">Provider · model · key</text>
  <text class="desc" x="28" y="265">Prompt template · default</text>
  <rect class="bx" x="328.667" y="202" width="302.667" height="83" rx="6"/>
  <text class="area" x="340.667" y="225">scheduler /scheduler</text>
  <text class="desc" x="340.667" y="246">Job list · Cron expr</text>
  <text class="desc" x="340.667" y="265">Last execution · manual execution · pause</text>
  <rect class="bx-dq" x="641.333" y="202" width="302.667" height="83" rx="6"/>
  <text class="area" x="653.333" y="225">translations /translation-management</text>
  <text class="desc" x="653.333" y="246">Edit key/value by lang</text>
  <text class="desc" x="653.333" y="265">Gap stats · category</text>
  <rect class="bx-ac" x="16" y="295" width="928" height="64" rx="6"/>
  <text class="area" x="28" y="318">Enterprise dashboards /dashboard</text>
  <text class="desc" x="28" y="339">Enter via `[Dashboards]` header.</text>
  <text class="strong" x="16" y="386">Legend</text>
  <rect class="bx" x="73.60" y="377" width="13" height="13" rx="3"/>
  <text class="tiny" x="92.60" y="387">Regular area</text>
  <rect class="bx-ac" x="183.20" y="377" width="13" height="13" rx="3"/>
  <text class="tiny" x="202.20" y="387">Highlighted · conditional areas</text>
  <rect class="bx-ch" x="407.75" y="377" width="13" height="13" rx="3"/>
  <text class="tiny" x="426.75" y="387">Global chrome</text>
  <rect class="bx-dq" x="523.40" y="377" width="13" height="13" rx="3"/>
  <text class="tiny" x="542.40" y="387">Empty · hidden</text>
  <rect class="bx-bt" x="645.10" y="377" width="13" height="13" rx="3"/>
  <text class="tiny" x="664.10" y="387">Button · Action</text>
</svg>
