<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" width="100%">
  <defs>
    <style>
      .heading { font-size: 13px; font-weight: bold; fill: #111827; }
      .label { font-size: 12px; fill: #475467; }
      .box-normal { fill: #fff; stroke: #d0d5dd; stroke-width: 1; rx: 6; }
      .box-highlight { fill: #f7f9ff; stroke: #d0d5dd; stroke-width: 1; rx: 6; }
      .spacer { fill: #f3f4f6; stroke: #d0d5dd; stroke-width: 1; }
      .line { stroke: #d0d5dd; stroke-width: 1; }
    </style>
  </defs>

  <!-- A. 실행 목록 화면 (좌측 상단) -->
  <rect class="box-normal" x="20" y="20" width="280" height="350"/>
  <text class="heading" x="30" y="40">A. 실행 목록</text>
  <text class="label" x="30" y="55">/projects/{id}/executions</text>

  <!-- 검색 영역 -->
  <rect class="spacer" x="30" y="65" width="260" height="35" rx="4"/>
  <text class="label" x="40" y="86">🔍 제목 검색</text>

  <!-- 생성 버튼 -->
  <rect class="box-highlight" x="30" y="110" width="260" height="30" rx="4"/>
  <text class="label" x="40" y="130">[+ 새 실행] (편집권한만)</text>

  <!-- 실행 카드 -->
  <rect class="box-normal" x="30" y="150" width="260" height="45" rx="4"/>
  <text class="label" x="40" y="165">🔹 ShopFlow iOS v1.0</text>
  <text class="label" x="40" y="180">진행 중 | 12/20 | 회귀 스모크</text>
  <text class="label" x="40" y="193">2026-07-20 14:32 | ⋮</text>

  <rect class="box-normal" x="30" y="205" width="260" height="45" rx="4"/>
  <text class="label" x="40" y="220">🔹 결제 기능 UAT</text>
  <text class="label" x="40" y="235">완료 | 15/15 | iOS v1.0 UAT</text>

  <!-- 페이징 텍스트 -->
  <rect class="box-highlight" x="30" y="260" width="260" height="35" rx="4"/>
  <text class="label" x="40" y="280">5/페이지 | 스크롤 시 다음 로드</text>

  <!-- B. 실행 상세 화면 (우측 상단) -->
  <rect class="box-normal" x="320" y="20" width="620" height="350"/>
  <text class="heading" x="330" y="40">B. 실행 상세</text>
  <text class="label" x="330" y="55">/projects/{id}/executions/{eid}</text>

  <!-- 상단 헤더 -->
  <rect class="spacer" x="330" y="65" width="600" height="50" rx="4"/>
  <text class="label" x="340" y="85">ShopFlow iOS v1.0 | 회귀 스모크 | 진행 중</text>
  <text class="label" x="340" y="100">작성자: tester1 | 생성: 2026-07-20 14:32</text>
  <text class="label" x="340" y="115">진행률 [████░░░░░░] 12/20</text>

  <!-- 필터 패널 (좌) -->
  <rect class="box-highlight" x="330" y="125" width="150" height="220" rx="4"/>
  <text class="heading" x="340" y="145">필터</text>
  <text class="label" x="340" y="165">결과</text>
  <text class="label" x="345" y="178">☑ PASS (5)</text>
  <text class="label" x="345" y="191">☐ FAIL (2)</text>
  <text class="label" x="345" y="204">☐ BLOCKED</text>
  <text class="label" x="345" y="217">☐ NOTRUN</text>
  <text class="label" x="340" y="235">우선순위</text>
  <text class="label" x="340" y="250">실행자</text>
  <text class="label" x="340" y="263">기타: 태그, 노트</text>

  <!-- 케이스 목록 테이블 (우) -->
  <rect class="box-normal" x="490" y="125" width="440" height="220" rx="4"/>
  <text class="heading" x="500" y="145">케이스 목록 (필터 적용)</text>

  <!-- 테이블 헤더 -->
  <rect class="spacer" x="490" y="155" width="440" height="25" rx="2"/>
  <text class="label" x="500" y="172">ID | 제목 | 결과 | 실행자 | 시각</text>

  <!-- 테이블 행들 -->
  <rect class="box-normal" x="490" y="185" width="440" height="28" rx="2"/>
  <text class="label" x="500" y="203">TC-0001 | 앱 설치 후 로그인 | ✓PASS | tester1 | 14:45</text>

  <rect class="box-normal" x="490" y="218" width="440" height="28" rx="2"/>
  <text class="label" x="500" y="236">TC-0005 | 결제 취소 | —NOTRUN | — | —</text>

  <rect class="box-highlight" x="490" y="251" width="440" height="28" rx="2"/>
  <text class="label" x="500" y="269">TC-0008 | 주문 조회 | ✗FAIL | tester1 | 15:20 (클릭 → C)</text>

  <!-- C. 결과 입력 화면 (아래) -->
  <rect class="box-normal" x="20" y="390" width="920" height="480"/>
  <text class="heading" x="30" y="410">C. 결과 입력</text>
  <text class="label" x="30" y="425">/executions/{eid}/testcases/{tcid}/result</text>

  <!-- 케이스 정보 -->
  <rect class="spacer" x="30" y="440" width="900" height="75" rx="4"/>
  <text class="heading" x="40" y="460">TC-0008: 주문 조회</text>
  <text class="label" x="40" y="475">사용자가 이전 주문 목록을 조회하고 상세를 본다 | 4스텝 | High | 첨부 2장</text>
  <text class="label" x="40" y="490">케이스 첨부파일 (읽기 전용)</text>

  <!-- 결과 입력 본체 -->
  <rect class="box-normal" x="30" y="525" width="900" height="330" rx="4"/>

  <!-- 플로팅 P/F/B/N 버튼 (우상) -->
  <rect x="820" y="540" width="38" height="33" rx="4" fill="#10b981" stroke="#059669" stroke-width="1"/>
  <text style="font-size: 18px; font-weight: bold; fill: #fff;" x="833" y="558">P</text>
  <text class="label" x="820" y="575">PASS</text>

  <rect x="870" y="540" width="38" height="33" rx="4" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>
  <text style="font-size: 18px; font-weight: bold; fill: #fff;" x="883" y="558">F</text>
  <text class="label" x="870" y="575">FAIL</text>

  <rect x="820" y="580" width="38" height="33" rx="4" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <text style="font-size: 16px; font-weight: bold; fill: #fff;" x="831" y="598">B</text>
  <text class="label" x="810" y="615">BLOCKED</text>

  <rect x="870" y="580" width="38" height="33" rx="4" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
  <text style="font-size: 18px; font-weight: bold; fill: #fff;" x="883" y="598">N</text>
  <text class="label" x="870" y="615">NOTRUN</text>

  <!-- 입력 필드 -->
  <text class="heading" x="40" y="555">노트 (마크다운)</text>
  <rect class="box-normal" x="40" y="563" width="760" height="48" rx="4"/>
  <text class="label" x="50" y="583">- 로그인 후 주문 목록이 정상 표시됨</text>
  <text class="label" x="50" y="598">- 상세 클릭 시 로드(3초 지연)</text>

  <text class="heading" x="40" y="630">태그</text>
  <rect class="box-normal" x="40" y="638" width="760" height="28" rx="4"/>
  <text class="label" x="50" y="656">[iOS] [주문] [성능-지연]</text>

  <text class="heading" x="40" y="683">JIRA</text>
  <rect class="box-normal" x="40" y="691" width="760" height="28" rx="4"/>
  <text class="label" x="50" y="709">SMP-285 (자동 감지)</text>

  <text class="heading" x="40" y="742">결과 첨부</text>
  <rect class="box-normal" x="40" y="750" width="760" height="45" rx="4"/>
  <text class="label" x="50" y="768">스크린샷 2장 | 로그 1개 | [삭제] [추가]</text>

  <text class="heading" x="40" y="814">이전 결과</text>
  <rect class="box-highlight" x="40" y="822" width="760" height="28" rx="4"/>
  <text class="label" x="50" y="840">[지난 회차 결과] (마크다운 | 평문) 2026-07-15 FAIL</text>

  <!-- 범례 -->
  <text class="label" x="30" y="875" style="font-size: 11px;">
    자동 저장: 변경 시 1.5초 후 | 보기만 하면 미저장 | 20초 폴링(탭 활성 시)
  </text>
</svg>
