<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#315efb" />
    </marker>
    <style>
      text { font-family: -apple-system, 'Malgun Gothic', sans-serif; }
      .title { font-size: 14px; font-weight: bold; fill: #111827; }
      .label { font-size: 12px; fill: #475467; }
      .box { stroke: #d0d5dd; fill: #fff; stroke-width: 1; rx: 6; }
      .link-label { font-size: 11px; fill: #475467; }
    </style>
  </defs>

  <!-- 로그인(S0) -->
  <rect class="box" x="50" y="20" width="160" height="50"/>
  <text class="title" x="130" y="52" text-anchor="middle">로그인(S0)</text>

  <!-- 수직선 -->
  <line x1="130" y1="70" x2="130" y2="100" stroke="#315efb" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 프로젝트 목록(S1) -->
  <rect class="box" x="50" y="100" width="160" height="50"/>
  <text class="title" x="130" y="132" text-anchor="middle">프로젝트 목록(S1)</text>

  <!-- 분기선 -->
  <line x1="130" y1="150" x2="130" y2="180" stroke="#315efb" stroke-width="2"/>
  <line x1="130" y1="180" x2="220" y2="180" stroke="#315efb" stroke-width="2"/>
  <line x1="130" y1="180" x2="340" y2="180" stroke="#315efb" stroke-width="2"/>

  <!-- 좌측 분기: 프로젝트 0건 -->
  <line x1="220" y1="180" x2="220" y2="210" stroke="#315efb" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect class="box" x="140" y="210" width="160" height="70"/>
  <text class="title" x="220" y="235" text-anchor="middle">프로젝트 0건</text>
  <text class="label" x="220" y="255" text-anchor="middle">생성 안내 +</text>
  <text class="label" x="220" y="270" text-anchor="middle">[+ 프로젝트 생성]</text>

  <!-- 우측 분기: [프로젝트 열기] -->
  <line x1="340" y1="180" x2="340" y2="210" stroke="#315efb" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect class="box" x="280" y="210" width="120" height="50"/>
  <text class="title" x="340" y="242" text-anchor="middle">[프로젝트 열기]</text>

  <!-- 우측 분기 화살표 -->
  <line x1="400" y1="235" x2="450" y2="235" stroke="#315efb" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text class="link-label" x="425" y="220" text-anchor="middle">/projects/{id}</text>

  <!-- 작업공간(S2) -->
  <rect class="box" x="450" y="210" width="120" height="50"/>
  <text class="title" x="510" y="242" text-anchor="middle">작업공간(S2)</text>
</svg>