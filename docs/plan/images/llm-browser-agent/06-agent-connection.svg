<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="800" viewBox="0 0 1060 800" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
  <defs>
    <marker id="a6" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#5b6472"/></marker>
    <marker id="a6b" markerWidth="9" markerHeight="9" refX="1" refY="3.2" orient="auto"><path d="M8,0 L0,3.2 L8,6.4 z" fill="#5b6472"/></marker>
    <style>
      .pn   { fill:#f7f8fa; stroke:#c9cfd8; stroke-width:1.4; rx:10; }
      .grpk { fill:#eef1f4; stroke:#98a2b0; stroke-width:1.4; rx:9; }
      .grpn { fill:#eef4fb; stroke:#5b8def; stroke-width:1.6; rx:9; stroke-dasharray:7 4; }
      .bk   { fill:#ffffff; stroke:#98a2b0; stroke-width:1.1; rx:6; }
      .bn   { fill:#ffffff; stroke:#5b8def; stroke-width:1.1; rx:6; }
      .win  { fill:#ffffff; stroke:#98a2b0; stroke-width:1.4; rx:8; }
      .bar  { fill:#eef1f4; stroke:#98a2b0; stroke-width:1.1; }
      .inp  { fill:#fbfcfd; stroke:#aeb6c2; stroke-width:1.1; rx:5; }
      .tabA { fill:#e8f1fd; stroke:#3f74d6; stroke-width:1.6; rx:5; }
      .tabI { fill:#f2f4f7; stroke:#c2c8d2; stroke-width:1; rx:5; }
      .onbg { fill:#dff0e0; stroke:#5f9160; stroke-width:1.2; rx:11; }
      .onkn { fill:#4c8a4f; }
      .btn  { fill:#eef1f4; stroke:#7d879a; stroke-width:1.2; rx:5; }
      .h    { font-size:15px; font-weight:700; fill:#1d232b; }
      .t    { font-size:12.5px; font-weight:700; fill:#232a33; }
      .f    { font-size:11.5px; fill:#3d4552; }
      .lb   { font-size:11.5px; fill:#3d4552; font-weight:600; }
      .ph   { font-size:11.5px; fill:#5b6472; }
      .n    { font-size:10.5px; fill:#6b7482; }
      .g    { font-size:11px; fill:#2f6b31; font-weight:700; }
      .ar   { stroke:#5b6472; stroke-width:1.6; fill:none; marker-end:url(#a6); marker-start:url(#a6b); stroke-dasharray:6 4; }
      .al   { font-size:10.5px; fill:#40495a; font-weight:600; }
    </style>
  </defs>

  <text x="30" y="30" font-size="18" font-weight="700" fill="#1d232b">에이전트 연동 — 컨테이너는 별도, 켜고 끄는 건 프로젝트 설정에서</text>
  <text x="30" y="49" class="n">점선 = 선택적 · 에이전트 스택이 아예 없어도 제품은 100% 정상 동작한다</text>

  <!-- Panel A: containers -->
  <rect class="pn" x="30" y="62" width="1000" height="272"/>
  <text class="h" x="46" y="86">컨테이너 지형</text>

  <rect class="grpk" x="46" y="98" width="440" height="192"/>
  <text class="t" x="58" y="118">제품 스택 — docker-compose-build/docker-compose.yml</text>
  <text class="n" x="58" y="134">한 줄도 안 바꾼다</text>
  <rect class="bk" x="60" y="144" width="200" height="46"/>
  <text class="f" x="70" y="162">testcasecraft-app</text><text class="n" x="70" y="179">Spring Boot + React</text>
  <rect class="bk" x="272" y="144" width="200" height="46"/>
  <text class="f" x="282" y="162">postgres</text><text class="n" x="282" y="179">단일 인스턴스</text>
  <rect class="bk" x="60" y="200" width="200" height="46"/>
  <text class="f" x="70" y="218">minio</text><text class="n" x="70" y="235">첨부 · 스크린샷</text>
  <rect class="bk" x="272" y="200" width="200" height="46"/>
  <text class="f" x="282" y="218">rag-service</text><text class="n" x="282" y="235">이미 선택적 서비스</text>
  <text class="n" x="60" y="268">rag-service 가 이미 「있으면 쓰고 없으면 숨긴다」로 돌고 있다 — 같은 패턴을 복사한다</text>

  <rect class="grpn" x="574" y="98" width="440" height="192"/>
  <text class="t" x="586" y="118">에이전트 스택 — 별도 compose (신규 · 제품과 무관)</text>
  <text class="n" x="586" y="134">따로 뜨고, 따로 죽고, 따로 배포된다</text>
  <rect class="bn" x="588" y="144" width="200" height="46"/>
  <text class="f" x="598" y="162">agent-web</text><text class="n" x="598" y="179">자체 UI + API</text>
  <rect class="bn" x="800" y="144" width="200" height="46"/>
  <text class="f" x="810" y="162">agent-runner</text><text class="n" x="810" y="179">browser-use + Chromium</text>
  <rect class="bn" x="588" y="200" width="200" height="46"/>
  <text class="f" x="598" y="218">agent-store</text><text class="n" x="598" y="235">스텝로그 · 비용 · 이미지</text>
  <rect class="bn" x="800" y="200" width="200" height="46"/>
  <text class="f" x="810" y="218">(선택) chromium 분리</text><text class="n" x="810" y="235">병렬 실행 시</text>
  <text class="n" x="588" y="268">이미지 약 1.5GB — 제품 배포에 안 들어간다. 셀프호스팅 고객에게 강제되지 않는다</text>

  <path class="ar" d="M492,194 L568,194"/>
  <text class="al" x="418" y="180" text-anchor="middle">프로젝트 설정에</text>
  <text class="al" x="530" y="308" text-anchor="middle">주소가 있을 때만</text>

  <!-- Panel B: settings -->
  <rect class="pn" x="30" y="346" width="1000" height="434"/>
  <text class="h" x="46" y="370">켜고 끄는 자리 — 프로젝트 설정에 탭 하나 추가</text>
  <text class="n" x="46" y="386">ProjectSettingsPage.jsx 는 이미 「일반 · 멤버」 탭 구조다. 세 번째 탭을 더한다</text>

  <!-- mockup window -->
  <rect class="win" x="46" y="398" width="560" height="364"/>
  <rect class="bar" x="46" y="398" width="560" height="32"/>
  <text class="t" x="60" y="419">프로젝트 설정 — AgensGraph</text>
  <rect class="tabI" x="60" y="440" width="76" height="26"/>
  <text class="f" x="86" y="457" text-anchor="middle">일반</text>
  <rect class="tabI" x="142" y="440" width="76" height="26"/>
  <text class="f" x="168" y="457" text-anchor="middle">멤버</text>
  <rect class="tabA" x="224" y="440" width="126" height="26"/>
  <text class="f" x="287" y="457" text-anchor="middle" font-weight="700">에이전트 연동</text>

  <text class="lb" x="62" y="497">에이전트 사용</text>
  <rect class="onbg" x="180" y="484" width="52" height="22"/>
  <circle class="onkn" cx="221" cy="495" r="8"/>
  <text class="g" x="242" y="500">On</text>
  <text class="n" x="278" y="500">끄면 아래 항목이 비활성 + 실행 화면이 사라진다</text>

  <text class="lb" x="62" y="536">에이전트 이름</text>
  <rect class="inp" x="180" y="522" width="410" height="26"/>
  <text class="ph" x="190" y="540">스테이징 QA 에이전트</text>

  <text class="lb" x="62" y="575">서버 주소</text>
  <rect class="inp" x="180" y="561" width="410" height="26"/>
  <text class="ph" x="190" y="579">https://qa-agent.internal:8080</text>

  <text class="lb" x="62" y="614">인증 토큰</text>
  <rect class="inp" x="180" y="600" width="410" height="26"/>
  <text class="ph" x="190" y="618">••••••••••••••••</text>
  <text class="n" x="190" y="638">저장 시 암호화 · 조회 응답은 마스킹 (LlmConfig·JiraConfig 와 동일)</text>

  <text class="lb" x="62" y="668">기본 프로필</text>
  <rect class="inp" x="180" y="654" width="410" height="26"/>
  <text class="ph" x="190" y="672">staging-default</text>
  <text class="ph" x="575" y="672">▾</text>

  <rect class="btn" x="180" y="694" width="96" height="28"/>
  <text class="f" x="228" y="713" text-anchor="middle">연결 테스트</text>
  <text class="g" x="288" y="713">✓ 연결됨 · v0.3.1 · 09:12</text>
  <text class="n" x="62" y="745">권한  프로젝트 설정 편집 권한이 있는 사람만 (canEditSettings — 기존 게이팅 재사용)</text>

  <!-- state table -->
  <rect class="win" x="626" y="398" width="404" height="364"/>
  <rect class="bar" x="626" y="398" width="404" height="32"/>
  <text class="t" x="640" y="419">상태별로 무엇이 보이나</text>

  <text class="t" x="640" y="456">① 설정 없음 (기본값)</text>
  <text class="f" x="640" y="475">자동화 화면에 에이전트 흔적이 없다.</text>
  <text class="n" x="640" y="492">신규 설치·기존 프로젝트의 기본 상태.</text>

  <text class="t" x="640" y="524">② 사용 = Off</text>
  <text class="f" x="640" y="543">설정값은 남아 있고 UI 만 숨는다.</text>
  <text class="n" x="640" y="560">잠깐 끌 때. 주소를 다시 입력할 필요 없다.</text>

  <text class="t" x="640" y="592">③ On · 서버 응답 정상</text>
  <text class="f" x="640" y="611">「에이전트로 실행」 버튼이 보인다.</text>
  <text class="n" x="640" y="628">누르면 에이전트 앱으로 넘어간다.</text>

  <text class="t" x="640" y="660">④ On · 서버 응답 없음</text>
  <text class="f" x="640" y="679">버튼은 보이되 비활성 + 안내 문구.</text>
  <text class="n" x="640" y="696">"에이전트 서버에 연결할 수 없습니다"</text>

  <text class="t" x="640" y="728">공통 원칙</text>
  <text class="f" x="640" y="747">어떤 상태에서도 제품의 다른 기능은</text>
  <text class="f" x="640" y="764">영향받지 않는다. 실패는 이 탭 안에서 끝난다.</text>
</svg>
