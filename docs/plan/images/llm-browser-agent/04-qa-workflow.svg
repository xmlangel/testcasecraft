<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="660" viewBox="0 0 1060 660" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
  <defs>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#5b6472"/></marker>
    <style>
      .st  { fill:#e8f1fd; stroke:#3f74d6; stroke-width:1.5; rx:9; }
      .pn  { fill:#f7f8fa; stroke:#c9cfd8; stroke-width:1.4; rx:10; }
      .c1  { fill:#fdeceb; stroke:#d0736b; stroke-width:1.4; rx:8; }
      .c2  { fill:#fdf6e6; stroke:#d8a15b; stroke-width:1.4; rx:8; }
      .c3  { fill:#eef4fb; stroke:#6f95c9; stroke-width:1.4; rx:8; }
      .ok  { fill:#eef3ee; stroke:#7ba07b; stroke-width:1.4; rx:8; }
      .no  { fill:#f4f0f7; stroke:#9b7fb8; stroke-width:1.4; rx:8; }
      .tt  { font-size:13px; font-weight:700; fill:#1d232b; }
      .t2  { font-size:12px; font-weight:700; fill:#1d232b; }
      .f   { font-size:11px; fill:#3d4552; }
      .n   { font-size:10.5px; fill:#6b7482; }
      .ar  { stroke:#5b6472; stroke-width:1.6; fill:none; marker-end:url(#a4); }
      .arl { font-size:10.5px; fill:#40495a; font-weight:600; }
    </style>
  </defs>

  <text x="30" y="30" font-size="18" font-weight="700" fill="#1d232b">QA 실행 관점 — 한 사이클</text>
  <text x="30" y="49" class="n">에이전트는 「실행해 주는 사람」이 아니라 「초안을 만들어 오는 신입」이다. 판정 책임은 QA 에게 남는다.</text>

  <rect class="st" x="30"  y="70" width="190" height="86"/>
  <text class="t2" x="42" y="92">1. 케이스 정비</text>
  <text class="f"  x="42" y="112">에이전트가 읽을 수 있게</text>
  <text class="f"  x="42" y="128">스텝을 행동+기대로 분리</text>
  <text class="n"  x="42" y="146">isAutomated 대신 태그로 표시</text>

  <rect class="st" x="245" y="70" width="190" height="86"/>
  <text class="t2" x="257" y="92">2. 프로필 준비</text>
  <text class="f"  x="257" y="112">계정 · URL · 테스트 데이터</text>
  <text class="f"  x="257" y="128">허용 도메인 · 금지 행동</text>
  <text class="n"  x="257" y="146">케이스 본문엔 계정 안 씀</text>

  <rect class="st" x="460" y="70" width="190" height="86"/>
  <text class="t2" x="472" y="92">3. 실행 세트 구성</text>
  <text class="f"  x="472" y="112">스모크 15~25건부터</text>
  <text class="f"  x="472" y="128">예상 소요·비용 확인 후 실행</text>
  <text class="n"  x="472" y="146">20건 ≈ 15분 · 약 $1</text>

  <rect class="st" x="675" y="70" width="190" height="86"/>
  <text class="t2" x="687" y="92">4. 실행 &amp; 관전</text>
  <text class="f"  x="687" y="112">스텝 타임라인 · 스크린샷</text>
  <text class="f"  x="687" y="128">헤매면 즉시 취소</text>
  <text class="n"  x="687" y="146">창을 닫아도 계속 돈다</text>

  <rect class="st" x="890" y="70" width="140" height="86"/>
  <text class="t2" x="902" y="92">5. 트리아지</text>
  <text class="f"  x="902" y="112">FAIL 3분류</text>
  <text class="f"  x="902" y="128">PASS 표본검증</text>
  <text class="n"  x="902" y="146">↓ 아래 상세</text>

  <path class="ar" d="M222,113 L241,113"/>
  <path class="ar" d="M437,113 L456,113"/>
  <path class="ar" d="M652,113 L671,113"/>
  <path class="ar" d="M867,113 L886,113"/>
  <path class="ar" d="M960,158 L960,186 L125,186 L125,160"/>
  <text class="arl" x="470" y="180">6. 피드백 — 케이스 문장·프로필·대상 세트를 고쳐 다음 사이클로</text>

  <rect class="pn" x="30" y="204" width="1000" height="212"/>
  <text class="tt" x="44" y="226">5-1. FAIL 은 세 갈래다 — 전부 결함으로 올리면 신뢰를 잃는다</text>

  <rect class="c1" x="48" y="240" width="310" height="160"/>
  <text class="t2" x="60" y="262">A. 진짜 결함</text>
  <text class="n"  x="60" y="282">판별</text>
  <text class="f"  x="60" y="299">· 스크린샷과 observation 이 일치</text>
  <text class="f"  x="60" y="316">· 3회 재실행 중 3회 같은 지점 실패</text>
  <text class="f"  x="60" y="333">· 사람이 같은 절차로 재현됨</text>
  <text class="n"  x="60" y="353">조치</text>
  <text class="f"  x="60" y="370">· 결함 등록 (스크린샷·스텝로그 첨부)</text>
  <text class="f"  x="60" y="387">· 케이스는 그대로 둔다</text>

  <rect class="c2" x="375" y="240" width="310" height="160"/>
  <text class="t2" x="387" y="262">B. 케이스가 모호</text>
  <text class="n"  x="387" y="282">판별</text>
  <text class="f"  x="387" y="299">· 재실행마다 다른 지점에서 실패</text>
  <text class="f"  x="387" y="316">· 엉뚱한 화면에서 헤맨 흔적</text>
  <text class="f"  x="387" y="333">· 스텝에 기대결과가 비어 있음</text>
  <text class="n"  x="387" y="353">조치</text>
  <text class="f"  x="387" y="370">· 스텝 문장을 행동+기대로 쪼갬</text>
  <text class="f"  x="387" y="387">· 고친 뒤 재실행 — 케이스 자산이 좋아진다</text>

  <rect class="c3" x="702" y="240" width="310" height="160"/>
  <text class="t2" x="714" y="262">C. 에이전트 오판</text>
  <text class="n"  x="714" y="282">판별</text>
  <text class="f"  x="714" y="299">· 화면은 정상인데 판정만 FAIL</text>
  <text class="f"  x="714" y="316">· 사람이 같은 절차로 통과</text>
  <text class="f"  x="714" y="333">· 금지 행동 가드레일에 막힌 것</text>
  <text class="n"  x="714" y="353">조치</text>
  <text class="f"  x="714" y="370">· userStatus 로 판정 덮어쓰기(사유 필수)</text>
  <text class="f"  x="714" y="387">· 3회 이상 반복되면 대상 세트에서 제외</text>

  <rect class="ok" x="30" y="436" width="490" height="196"/>
  <text class="tt" x="44" y="458">5-2. PASS 를 그냥 믿지 않는다 — 거짓 통과가 더 위험하다</text>
  <text class="f"  x="44" y="480">LLM 은 &quot;대충 비슷하면 통과&quot; 로 기울 수 있다. 실패보다 조용해서 더 오래 산다.</text>
  <text class="n"  x="44" y="502">운영 규칙(제안)</text>
  <text class="f"  x="44" y="522">· PASS 중 20% 를 표본으로 뽑아 스크린샷 근거를 눈으로 확인</text>
  <text class="f"  x="44" y="542">· evidence 가 비었거나 한 줄뿐인 PASS 는 무조건 확인 대상</text>
  <text class="f"  x="44" y="562">· 스텝 수가 비정상적으로 적은 PASS(예: 2스텝 만에 종료)도 확인</text>
  <text class="f"  x="44" y="582">· 신규 도입 첫 2주는 표본 100% — 신뢰 곡선을 직접 그린 뒤 낮춘다</text>
  <text class="n"  x="44" y="606">에이전트 판정은 참고값이고, 릴리즈 게이트에 쓰는 값은 QA 가 확정한 것이다.</text>

  <rect class="no" x="540" y="436" width="490" height="196"/>
  <text class="tt" x="554" y="458">맡기면 안 되는 케이스 — 실행 전에 걸러낸다</text>
  <text class="f"  x="554" y="480">· 결제 · 계약 · 실제 메일 발송 등 되돌릴 수 없는 행동</text>
  <text class="f"  x="554" y="500">· 데이터 삭제 · 계정 탈퇴 (가드레일로도 막지만 애초에 넣지 않는다)</text>
  <text class="f"  x="554" y="520">· 파일 업로드/다운로드가 판정의 핵심인 케이스</text>
  <text class="f"  x="554" y="540">· 캡차 · OTP · 외부 인증 리다이렉트가 끼는 흐름</text>
  <text class="f"  x="554" y="560">· 픽셀 단위 레이아웃 · 색상 검증</text>
  <text class="f"  x="554" y="580">· 재현성이 릴리즈 게이트인 케이스 → 기존 JUnit 자동화로 남긴다</text>
  <text class="n"  x="554" y="604">잘 맞는 곳: 반복 스모크 · 회귀 초안 · 탐색적 테스트 보조 · 케이스 문장 품질 점검</text>
</svg>
